{% comment %}
The dateline strip that sits above a listing, borrowed from a newspaper's
folio line. Pass `edition` (left label) and `folio` (right label).
{% endcomment %}
<div class="flex flex-wrap items-center gap-x-4 gap-y-1 border-y-2 border-ink py-2 text-2xs font-bold uppercase tracking-[0.18em] text-ink">
  <span>{{ edition|default:"Varsity Events" }}</span>
  <span class="opacity-30">◆</span>
  <span class="text-ink-subtle">{% now "l j F Y" %}</span>
  <span class="ml-auto text-ink-subtle">{{ folio }}</span>
</div>
