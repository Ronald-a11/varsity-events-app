{% extends "base.html" %}

{% block title %}Password updated · {{ SITE_NAME }}{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md px-4 py-14 text-center sm:px-6">
    <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-600 text-3xl text-white">✓</span>
    <h1 class="mt-4 text-2xl font-extrabold tracking-tight text-ink">Password updated</h1>
    <p class="mx-auto mt-2 max-w-sm text-sm leading-relaxed text-ink-subtle">
      You're all set. Sign in with your new password and get back to it.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary mt-6">Sign in</a>
  </div>
{% endblock %}
