{% comment %}
  Posts the checkout over fetch, opens the prompt in place, and tracks it.
  Without JavaScript the form posts normally and the full status page takes
  over, so nothing here is load-bearing for correctness.
{% endcomment %}
<script>
  (function () {
    const form = document.querySelector("[data-checkout-form]");
    const modal = document.getElementById("push-modal");
    if (!form || !modal) return;

    const panel = modal.querySelector("[data-push-panel]");
    const el = (name) => modal.querySelector(`[data-modal-${name}]`);
    const dots = [...modal.querySelectorAll("[data-modal-dot]")];
    const submitBtn = document.querySelector("[data-checkout-submit]");
    const submitLabel = document.querySelector("[data-checkout-label]");
    const formError = document.querySelector("[data-checkout-error]");

    let state = null;      // the payment payload from the server
    let secondsLeft = 0;
    let cooldown = 45;
    let attempts = 0;
    let finished = false;
    let ticker = null;

    const MAX_ATTEMPTS = 120;
    const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

    // -- chrome -------------------------------------------------------

    function open() {
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.body.style.overflow = "hidden";
      panel.animate(
        [{ opacity: 0, transform: "translateY(12px) scale(.97)" }, { opacity: 1, transform: "none" }],
        { duration: 260, easing: "cubic-bezier(.16,1,.3,1)" }
      );
      el("close").focus();
    }

    function close() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      document.body.style.overflow = "";
    }

    function setStep(n) {
      dots.forEach((dot, i) => {
        const step = i + 1;
        dot.classList.toggle("step-dot-done", step < n);
        dot.classList.toggle("step-dot-active", step === n);
        dot.textContent = step < n ? "✓" : String(step);
      });
    }

    function say(text, tone) {
      el("status").innerHTML =
        `<span class="h-1.5 w-1.5 rounded-full ${tone || "bg-brand-500 animate-pulse"}"></span>${text}`;
    }

    function stop() {
      finished = true;
      if (ticker) clearInterval(ticker);
      el("spinner")?.classList.add("hidden");
      el("ping")?.classList.add("hidden");
      el("resend").setAttribute("disabled", "disabled");
    }

    function resetSubmit() {
      submitBtn?.classList.remove("pointer-events-none");
      if (submitLabel) submitLabel.textContent = submitLabel.dataset.idle || "Continue";
    }

    // -- countdown ----------------------------------------------------

    function startTicking() {
      ticker = setInterval(() => {
        if (finished) return;

        secondsLeft = Math.max(0, secondsLeft - 1);
        el("timer").textContent = clock(secondsLeft);

        if (cooldown > 0) {
          cooldown -= 1;
          el("resend-in").textContent = `(${cooldown}s)`;
          if (cooldown === 0) {
            el("resend").removeAttribute("disabled");
            el("resend-in").textContent = "";
          }
        }

        if (secondsLeft === 0) {
          stop();
          say("Your held place has been released.", "bg-slate-400");
        }
      }, 1000);
    }

    // -- polling ------------------------------------------------------

    async function poll() {
      if (finished || !state) return;
      attempts += 1;

      if (attempts > MAX_ATTEMPTS) {
        stop();
        say("Stopped checking. Open the full page to see where it got to.", "bg-slate-400");
        return;
      }

      try {
        const res = await fetch(state.state_url, {
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });

        // A payment that's gone will never settle — retrying only adds load.
        if (res.status === 404 || res.status === 410) {
          stop();
          say("We can't find this payment any more.", "bg-rose-500");
          return;
        }
        if (!res.ok) return;

        const data = await res.json();

        if (data.settled && data.ticket_url) {
          stop();
          setStep(4);
          el("title").textContent = "Payment received";
          el("lead").textContent = "Taking you to your ticket…";
          say("Confirmed — your ticket is live.", "bg-emerald-500");
          setTimeout(() => (window.location = data.ticket_url), 900);
          return;
        }

        if (!data.open) {
          stop();
          say(data.label || "That payment didn't go through.", "bg-rose-500");
          el("full").classList.add("btn-primary");
          return;
        }

        if (attempts > 6) say("Still waiting — the prompt can take a minute.");
      } catch (e) {
        /* transient blip; the next tick tries again */
      }
    }

    async function loop() {
      await poll();
      if (finished) return;
      setTimeout(loop, attempts <= 10 ? 3000 : 6000);
    }

    // -- launching ----------------------------------------------------

    function launch(payment) {
      state = payment;
      secondsLeft = payment.seconds_left;

      el("icon").textContent = payment.icon;
      el("amount").textContent = payment.amount;
      el("timer").textContent = clock(secondsLeft);
      el("lead").innerHTML =
        `${payment.method} has sent a PIN prompt to ` +
        `<span class="font-mono font-semibold text-white">${payment.phone_masked}</span>`;
      el("full").href = payment.status_url;

      if (payment.is_simulated) {
        const sim = el("simulator");
        sim.href = payment.simulator_url;
        sim.classList.remove("hidden");
        el("resend").classList.add("hidden");
        say("Simulated — approve or decline it in the simulator.", "bg-amber-500");
      }

      setStep(2);
      open();
      startTicking();
      loop();
    }

    // -- the form -----------------------------------------------------

    form.addEventListener("submit", async (event) => {
      const chosen = form.querySelector("input[name=method]:checked")?.value;

      // Only the wallet pushes belong in the pop-up. The hosted page and the
      // manual transfer both need a real navigation, so let those post normally.
      if (chosen === "web" || chosen === "ecocash_direct") {
        submitBtn?.classList.add("pointer-events-none");
        if (submitLabel) {
          submitLabel.innerHTML =
            '<span class="spinner mr-2 align-[-2px]" aria-hidden="true"></span>Taking you there…';
        }
        return;
      }

      event.preventDefault();
      formError?.classList.add("hidden");
      submitBtn?.classList.add("pointer-events-none");
      if (submitLabel) {
        submitLabel.innerHTML =
          '<span class="spinner mr-2 align-[-2px]" aria-hidden="true"></span>Sending to your phone…';
      }

      try {
        const res = await fetch(form.action || window.location.href, {
          method: "POST",
          body: new FormData(form),
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        const data = await res.json();

        if (data.redirect) return (window.location = data.redirect);

        if (!data.ok) {
          resetSubmit();
          if (formError) {
            formError.textContent = data.error || "That didn't work. Try again.";
            formError.classList.remove("hidden");
          }
          return;
        }

        resetSubmit();
        launch(data.payment);
      } catch (e) {
        // Network trouble, or the server answered with something we can't read:
        // fall back to the ordinary post rather than stranding the payer.
        form.submit();
      }
    });

    // -- resend -------------------------------------------------------

    el("resend").addEventListener("click", async () => {
      if (!state) return;
      el("resend").setAttribute("disabled", "disabled");
      say("Sending it again…");

      try {
        const body = new FormData();
        body.append("csrfmiddlewaretoken", form.querySelector("[name=csrfmiddlewaretoken]").value);
        await fetch(state.resend_url, {
          method: "POST",
          body,
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        say("Sent again — check your phone.");
      } catch (e) {
        say("Couldn't send it again. Try the full page.", "bg-rose-500");
      }

      cooldown = 45;
      el("resend-in").textContent = `(${cooldown}s)`;
    });

    // -- dismissal ----------------------------------------------------

    el("close").addEventListener("click", close);
    modal.querySelector("[data-push-backdrop]").addEventListener("click", close);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !modal.classList.contains("hidden")) close();
    });
  })();
</script>
